<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — LUMEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="header">
  <div class="container header__row">
    <a href="index.html" class="brand"><span class="brand__mark">L</span><span>LUMEN<span class="brand__sub">Curated Technology</span></span></a>
    <div class="checkout-steps" style="margin:0 0 0 auto;">
      <span class="is-active"><i class="fa-solid fa-circle-check"></i> Cart</span>
      <span class="is-active">Checkout</span>
      <span>Confirmation</span>
    </div>
    <div class="header__icons">
      <a href="cart.html" class="icon-btn" aria-label="Cart"><i class="fa-solid fa-bag-shopping"></i><span class="badge badge--hidden" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<main>
  <div class="container" style="padding:34px 0 80px;">
    <h1 style="font-family:var(--font-display);font-size:30px;margin:0 0 26px;">Checkout</h1>
    <div id="checkout-root"></div>
  </div>
</main>

<footer class="footer">
  <div class="container footer__bottom" style="border-top:none;">
    <span>© 2026 LUMEN Technology Pvt. Ltd. All rights reserved.</span>
    <div class="payment-icons"><i class="fa-brands fa-cc-visa"></i><i class="fa-brands fa-cc-mastercard"></i><i class="fa-brands fa-google-pay"></i><i class="fa-solid fa-money-bill-wave"></i></div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
